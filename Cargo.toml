[package]
name = "hexagonal-architecture-validator"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Deterministic dependency-boundary validation for Rust projects"
license = "MIT"
repository = "https://github.com/nfma/hexagonal-architecture-validator"
readme = "README.md"
keywords = ["architecture", "dependencies", "hexagonal", "lint", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hav"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "3.0.3", features = ["full", "visit"] }
thiserror = "2.0.18"
toml = "1.1.4"

[profile.release]
lto = "thin"
strip = "symbols"
