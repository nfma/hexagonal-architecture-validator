version = 1
preset = "hexagonal"

[analysis]
strict = true
detect_cycles = true

# Adapt these patterns to the project's declared boundaries. A role matches
# when either one of its module regexes or one of its path regexes matches.
[[roles]]
id = "core"
description = "Domain behavior and policy"
paths = ["^src/core(?:/|\\.rs$)", "^src/domain(?:/|\\.rs$)"]

[[roles]]
id = "application"
description = "Application use cases and orchestration"
paths = ["^src/application(?:/|\\.rs$)"]

[[roles]]
id = "port"
description = "Purposeful application conversations"
paths = ["^src/ports(?:/|\\.rs$)"]

[[roles]]
id = "adapter"
description = "Technology-specific incoming and outgoing adapters"
paths = ["^src/adapters?(?:/|\\.rs$)"]

[[roles]]
id = "composition-root"
description = "Narrow application wiring and startup boundary"
modules = ["::composition_root(?:$|::)"]
paths = ["^src/main\\.rs$", "^src/bin/[^/]+\\.rs$"]

# Allowed rules are explicit, narrow exceptions to named forbidden rules. This
# example permits one adapter boundary to reference composition-root wiring.
[[allowed]]
id = "adapter-startup-hook"
description = "Adapters may invoke the narrow composition-root startup hook"
from = ["adapter"]
to = ["composition-root"]
exempts = ["adapters-must-not-depend-on-composition-root"]
