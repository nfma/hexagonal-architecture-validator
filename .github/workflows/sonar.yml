name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_LLVM_COV_VERSION: "0.6.21"
  RUST_TOOLCHAIN: "1.86.0"

jobs:
  sonar:
    name: SonarQube Cloud
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: sonar
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,llvm-tools-preview,rustfmt \
            --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test with coverage
        run: cargo llvm-cov --all-targets --all-features --locked --lcov --output-path lcov.info

      - name: Check for SonarQube Cloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is required; add it as a repository Actions secret." >&2
            exit 1
          fi

      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

  sonar-not-applicable:
    name: SonarQube Cloud (not applicable)
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain skipped analysis
        run: >-
          echo "::notice::SonarQube Cloud analysis is not applicable to Dependabot or fork pull requests; the protected Sonar job is intentionally skipped."
