name: Check Semgrep rules

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-semgrep-rules
  cancel-in-progress: false

jobs:
  update:
    name: Check rule-pack drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: .semgrep/packs.lock.json

      - name: Test rule-pack helper
        shell: bash
        run: python3 -m unittest tests/test_semgrep_packs.py

      - name: Download current rule packs
        shell: bash
        run: |
          rules="$RUNNER_TEMP/semgrep-rules"
          mkdir -p "$rules"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 8388608 \
            --output "$rules/default.yml" \
            https://semgrep.dev/c/p/default
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 8388608 \
            --output "$rules/security-audit.yml" \
            https://semgrep.dev/c/p/security-audit

      - name: Refresh current rule-pack metadata
        shell: bash
        run: >-
          python3 scripts/semgrep_packs.py update
          --manifest .semgrep/packs.lock.json
          --input-dir "$RUNNER_TEMP/semgrep-rules"

      - name: Validate refreshed rule packs
        shell: bash
        run: |
          rules="$RUNNER_TEMP/semgrep-rules"
          python3 scripts/semgrep_packs.py verify \
            --manifest .semgrep/packs.lock.json \
            --input-dir "$rules"
          uvx --no-build --from semgrep==1.173.0 semgrep scan \
            --validate \
            --metrics=off \
            --config "$rules/default.yml" \
            --config "$rules/security-audit.yml"

      - name: Require a protected lock update when packs drift
        shell: bash
        run: |
          if ! git diff --exit-code -- .semgrep/packs.lock.json; then
            echo "::error::Semgrep rule packs changed. Refresh the lock locally and submit a protected pull request."
            exit 1
          fi
