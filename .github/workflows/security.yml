name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-and-secrets:
    name: Semgrep and Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true

      - name: Install pinned Gitleaks
        run: |
          ./scripts/install-linux-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Test Semgrep report checker
        shell: bash
        run: >-
          python3 -m unittest
          tests/test_check_semgrep.py
          tests/test_semgrep_packs.py

      - name: Run Semgrep community security rules
        shell: bash
        run: |
          rules=".semgrep/rules"
          report="$RUNNER_TEMP/semgrep.json"
          mkdir -p "$rules"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 8388608 \
            --output "$rules/default.yml" \
            https://semgrep.dev/c/p/default
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 8388608 \
            --output "$rules/security-audit.yml" \
            https://semgrep.dev/c/p/security-audit
          python3 scripts/semgrep_packs.py verify \
            --manifest .semgrep/packs.lock.json \
            --input-dir "$rules"
          uvx --no-build --from semgrep==1.173.0 semgrep scan \
            --config "$rules/default.yml" \
            --config "$rules/security-audit.yml" \
            --error \
            --metrics=off \
            --exclude target \
            --json \
            --output "$report" \
            .
          python3 scripts/check_semgrep.py \
            --report "$report" \
            --baseline .semgrep-baseline.json \
            --repository-root .

      - name: Scan Git history for secrets
        run: gitleaks git --redact --verbose .

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan dependencies and secrets
        run: >-
          trivy fs
          --scanners vuln,secret
          --severity MEDIUM,HIGH,CRITICAL
          --exit-code 1
          --skip-dirs target
          .
