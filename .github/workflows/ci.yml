name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            lint: true
          - toolchain: 1.86.0
            lint: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --no-self-update
      - name: Install lint components
        if: matrix.lint
        run: rustup component add --toolchain "${{ matrix.toolchain }}" rustfmt clippy
      - name: Check formatting
        if: matrix.lint
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Run Clippy
        if: matrix.lint
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --locked

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  package-smoke-test:
    name: Package smoke test
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup target add "$TARGET" --toolchain stable
      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"
      - name: Package release archive
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          release_tag="v${crate_version}"
          artifact="hexagonal-architecture-validator-${release_tag}-${TARGET}.tar.gz"
          mkdir -p dist/package
          cp "target/${TARGET}/release/hav" dist/package/hav
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/${artifact}" hav README.md LICENSE
          cd dist
          sha256sum -- "${artifact}" > SHA256SUMS
      - name: Exercise documented checksum verification
        shell: bash
        run: |
          # Assert the literal command from the documentation.
          # shellcheck disable=SC2016
          grep -Fq 'grep "  $artifact\$" SHA256SUMS | sha256sum -c -' docs/INSTALLATION.md
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          artifact="hexagonal-architecture-validator-v${crate_version}-${TARGET}.tar.gz"
          cd dist
          grep "  $artifact\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$artifact"
          ./hav --version
