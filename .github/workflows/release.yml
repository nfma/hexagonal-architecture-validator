name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and release notes
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
          test -f "docs/release-notes-${GITHUB_REF_NAME}.md"
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}" --toolchain stable
      - name: Run release tests
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          artifact="hexagonal-architecture-validator-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          mkdir -p dist/package
          cp "target/${TARGET}/release/hav" dist/package/hav
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/${artifact}" hav README.md LICENSE
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish checksummed release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksum manifest
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.tar.gz dist/SHA256SUMS
          --verify-tag
          --title "hexagonal-architecture-validator ${GITHUB_REF_NAME}"
          --notes-file "docs/release-notes-${GITHUB_REF_NAME}.md"
