name: Repository quality

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned shell analyzers
        run: |
          ./scripts/install-linux-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Check shell syntax and quality
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(git ls-files -z -- '*.sh')
          test "${#shell_files[@]}" -gt 0
          for file in "${shell_files[@]}"; do
            if head -n 1 "$file" | grep -q 'bash'; then
              bash -n "$file"
            else
              sh -n "$file"
            fi
          done
          shellcheck -- "${shell_files[@]}"
          shfmt -d -i 2 -ci -bn -- "${shell_files[@]}"

  repository:
    name: Workflow and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true

      - name: Install pinned workflow analyzers
        run: |
          ./scripts/install-linux-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Validate workflow syntax
        run: actionlint

      - name: Audit workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona auditor --min-severity medium .github/workflows

      - name: Lint YAML
        run: uvx --no-build --from yamllint==1.38.0 yamllint .github

      - name: Validate tracked TOML
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python -c 'import sys,tomllib; tomllib.load(open(sys.argv[1], "rb"))' "$file"
          done < <(git ls-files -z '*.toml')
